<!DOCTYPE html>
<!-- Layout comum dos e-mails: cada template passa só o conteúdo -->
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(conteudo)">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Venda de Carros</title>
</head>
<!-- E-mail: estilos inline, pois muitos clientes ignoram <style> -->
<body style="margin:0; padding:0; background-color:#f4f4f5; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f4f5; padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:560px; background-color:#ffffff; border-radius:8px; overflow:hidden;">
                <tr>
                    <td style="background-color:#1e3a8a; padding:24px 32px; color:#ffffff; font-size:20px; font-weight:bold;">
                        Sistema de Venda de Carros
                    </td>
                </tr>
                <tr>
                    <td style="padding:32px; color:#27272a; font-size:16px; line-height:1.6;">
                        <th:block th:replace="${conteudo}"></th:block>
                    </td>
                </tr>
                <tr>
                    <td style="padding:16px 32px; background-color:#fafafa; color:#71717a; font-size:12px;">
                        Este é um e-mail automático, não responda.
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
