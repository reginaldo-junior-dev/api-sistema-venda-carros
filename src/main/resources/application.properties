spring.application.name=api-sistema-venda-carros

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${VENDA_CARROS_DB_URL}
spring.datasource.username=${VENDA_CARROS_DB_USERNAME}
spring.datasource.password=${VENDA_CARROS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Endereço do front, sem barra no final (CORS e volta do login Google). Em produção: o domínio da Vercel
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

stripe.secret-key=${STRIPE_SECRET_KEY}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET}

# Listas paginadas: ?page=0&size=20&sort=campo,desc
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100
# JSON das listas: { content, page }
spring.data.web.pageable.serialization-mode=via-dto

# Tempo até uma compra pendente sem pagamento ser cancelada
compra.expiracao.tempo=30m
# Intervalo da verificação (ISO-8601: PT1M = 1 minuto)
compra.expiracao.intervalo=PT1M
# Confere na Stripe os pagamentos com cartão ainda pendentes, caso o webhook não chegue
pagamento.reconciliacao.intervalo=PT1M

# Swagger UI: /swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.persist-authorization=true

# AWS S3 (imagens dos carros). Sem as chaves, usa a cadeia padrão da AWS (ex.: IAM Role)
aws.region=${AWS_REGION:sa-east-1}
aws.s3.bucket=${AWS_S3_BUCKET:sistema-venda-carros-imagens-reginaldo}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# E-mail (dev: Mailtrap sandbox; trocar host/porta para usar outro SMTP, ex.: Mailpit localhost:1025)
spring.mail.host=${MAIL_HOST:sandbox.smtp.mailtrap.io}
spring.mail.port=${MAIL_PORT:2525}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
email.remetente=${MAIL_REMETENTE:no-reply@vendacarros.com}

# Upload de imagens dos carros
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
