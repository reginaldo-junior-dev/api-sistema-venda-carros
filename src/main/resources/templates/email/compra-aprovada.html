<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{email/layout :: layout(~{::conteudo})}">
<body>
<div th:fragment="conteudo">
    <p style="margin:0 0 16px;">Olá, <strong th:text="${nome}">Cliente</strong>!</p>
    <p style="margin:0 0 16px;">Seu pagamento foi confirmado e a compra está aprovada. Parabéns pelo carro novo!</p>
    <table role="presentation" cellpadding="0" cellspacing="0"
           style="width:100%; margin:0 0 16px; background-color:#f0fdf4; border-left:4px solid #16a34a; border-radius:4px;">
        <tr>
            <td style="padding:16px;">
                <div style="color:#71717a; font-size:13px;">Veículo</div>
                <div style="font-weight:bold; margin-bottom:8px;" th:text="${carro}">Carro</div>
                <div style="color:#71717a; font-size:13px;">Valor pago</div>
                <div style="font-weight:bold;"
                     th:text="'R$ ' + ${#numbers.formatDecimal(valor, 1, 'POINT', 2, 'COMMA')}">R$ 0,00</div>
            </td>
        </tr>
    </table>
    <p style="margin:0;">Em breve entraremos em contato para combinar a entrega.</p>
</div>
</body>
</html>
